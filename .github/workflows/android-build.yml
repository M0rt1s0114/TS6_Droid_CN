name: Android CI (Precompiled SO Build)

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch: # 允许你在 GitHub 页面上点击手动触发

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1 # Node24，规避 Node20 弃用问题

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0 # Node24，规避 Node20 弃用问题
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      # 💡 Android Lint 静态检查：只报告问题，不中断后续构建
      # 报告会作为 artifact 上传，可在 Actions 页面下载查看
      - name: Run Android Lint
        run: ./gradlew --no-daemon lintDebug -x buildRustLibs
        continue-on-error: true

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7.0.1 # Node24，规避 Node20 弃用问题
        with:
          name: TS6-Han-Lint-Report
          path: app/build/reports/
          if-no-files-found: warn

      # 💡 核心：利用 -x 参数强制跳过原作者的 Rust 编译任务
      # Gradle 会直接使用仓库内已提交的 jniLibs 现成 .so 库打包
      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug -x buildRustLibs

      - name: Upload Finished APK
        uses: actions/upload-artifact@v7.0.1 # Node24，规避 Node20 弃用问题
        with:
          name: TS6-Han-Android-App
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
